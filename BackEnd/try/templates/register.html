<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol - BetterBoxd</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-yellow-400">Kayıt Ol</h2>
        {% if error %}
            <div class="bg-red-500 text-white p-2 mb-4 rounded">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-2">
                <input type="text" name="first_name" placeholder="Ad" class="w-full p-2 rounded bg-gray-700 border border-gray-600 mb-2" required>
                <input type="text" name="last_name" placeholder="Soyad" class="w-full p-2 rounded bg-gray-700 border border-gray-600" required>
            </div>
            <div class="mb-2">
                <input type="text" name="username" placeholder="Kullanıcı Adı" class="w-full p-2 rounded bg-gray-700 border border-gray-600" required>
            </div>
            <div class="mb-2">
                <input type="email" name="email" placeholder="E-posta" class="w-full p-2 rounded bg-gray-700 border border-gray-600" required>
            </div>
            <div class="mb-6">
                <input type="password" name="password" placeholder="Şifre" class="w-full p-2 rounded bg-gray-700 border border-gray-600" required>
            </div>
            <button type="submit" class="w-full bg-yellow-400 text-black font-bold py-2 rounded hover:bg-yellow-500 transition">Kayıt Ol</button>
        </form>
        <p class="mt-4 text-sm text-gray-400">Zaten hesabın var mı? <a href="/login" class="text-yellow-400">Giriş Yap</a></p>
    </div>
</body>
</html>

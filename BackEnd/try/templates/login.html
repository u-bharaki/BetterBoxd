<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap - BetterBoxd</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold mb-6 text-yellow-400">Giriş Yap</h2>
        {% if error %}
            <div class="bg-red-500 text-white p-2 mb-4 rounded">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-4">
                <label class="block mb-2">Kullanıcı Adı</label>
                <input type="text" name="username" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-yellow-400 outline-none" required>
            </div>
            <div class="mb-6">
                <label class="block mb-2">Şifre</label>
                <input type="password" name="password" class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:border-yellow-400 outline-none" required>
            </div>
            <button type="submit" class="w-full bg-yellow-400 text-black font-bold py-2 rounded hover:bg-yellow-500 transition">Giriş Yap</button>
        </form>
        <p class="mt-4 text-sm text-gray-400">Hesabın yok mu? <a href="/register" class="text-yellow-400">Kayıt Ol</a></p>
    </div>
</body>
</html>
